<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Muestra de estilo · rosa v2</title>
    <style>
      body {
        margin: 0;
        padding: 1rem;
        background: #f8f6f1;
        color: #37313f;
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      small {
        color: #5e5668;
      }
      .ctl {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem 1.25rem;
        align-items: center;
        margin: 0.5rem 0;
      }
      button {
        min-height: 44px;
        padding: 0 1rem;
        border: 0;
        border-radius: 999px;
        background: #5b3f8f;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      .row {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 0.75rem;
        margin-top: 0.75rem;
      }
      .cell {
        position: relative;
        background: #fffdf8;
        border: 1px solid #dcd0f0;
        border-radius: 14px;
        padding: 0.5rem;
        overflow: hidden;
      }
      .cell svg {
        width: 100%;
        height: auto;
        display: block;
      }
      .cell::after {
        content: '';
        position: absolute;
        inset: 0;
        background-image: var(--grain);
        mix-blend-mode: multiply;
        opacity: var(--gi, 0.6);
        pointer-events: none;
      }
      .small {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        margin-top: 1rem;
      }
      .small svg {
        width: 40px;
        height: 52px;
      }
    </style>
  </head>
  <body>
    <h1>Rosa v2 (H6.0): sin filtros</h1>
    <p>
      <small
        >Seis semillas de la misma flor. Sin <code>feTurbulence</code> ni
        <code>feDisplacementMap</code>: solo degradados, trazos y motas.</small
      >
    </p>
    <div class="ctl">
      <label>Grano de papel <input type="range" id="gi" min="0" max="100" value="60" /></label>
      <button type="button" id="dl">Descargar grano (WebP)</button>
      <small id="size"></small>
    </div>

    <svg width="0" height="0" aria-hidden="true" focusable="false" style="position: absolute">
      <defs>
        <radialGradient id="gA" cx="50%" cy="100%" r="110%">
          <stop offset="0" stop-color="#b84d6c" />
          <stop offset=".55" stop-color="#e07f9b" />
          <stop offset="1" stop-color="#f6cdd7" />
        </radialGradient>
        <radialGradient id="gB" cx="50%" cy="100%" r="110%">
          <stop offset="0" stop-color="#c25a78" />
          <stop offset=".55" stop-color="#e48ba4" />
          <stop offset="1" stop-color="#f9d9e1" />
        </radialGradient>
        <radialGradient id="gC" cx="50%" cy="100%" r="110%">
          <stop offset="0" stop-color="#cb6a86" />
          <stop offset=".55" stop-color="#ea9bb0" />
          <stop offset="1" stop-color="#fbe3e8" />
        </radialGradient>
        <radialGradient id="gD" cx="50%" cy="100%" r="110%">
          <stop offset="0" stop-color="#bf5573" />
          <stop offset=".55" stop-color="#dc7e98" />
          <stop offset="1" stop-color="#f2b3c3" />
        </radialGradient>
        <radialGradient id="shade" cx="50%" cy="50%" r="50%">
          <stop offset=".55" stop-color="#6e2a40" stop-opacity="0" />
          <stop offset="1" stop-color="#6e2a40" stop-opacity=".30" />
        </radialGradient>
        <radialGradient id="wash" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#e58fa4" stop-opacity=".34" />
          <stop offset=".7" stop-color="#e8c8d1" stop-opacity=".16" />
          <stop offset="1" stop-color="#e8c8d1" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="gLeaf" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#4a6444" />
          <stop offset=".6" stop-color="#6f8a66" />
          <stop offset="1" stop-color="#9db592" />
        </linearGradient>
        <path id="pt" d="M0 0 C-21 -3 -27 -26 -13 -38 C-6 -44 6 -44 13 -38 C27 -26 21 -3 0 0Z" />
        <path
          id="sep"
          d="M0 0 C-3 6 -3 14 0 22 C3 14 3 6 0 0Z"
          fill="#5d7a55"
          stroke="#2f4a2e"
          stroke-opacity=".3"
          stroke-width=".5"
        />
        <g id="leaf">
          <path
            d="M0 0 C8 -11 24 -15 40 -9 C34 4 16 9 0 0Z"
            fill="url(#gLeaf)"
            stroke="#2f4a2e"
            stroke-opacity=".4"
            stroke-width=".7"
          />
          <path
            d="M1 -.5 C14 -5 26 -7 38 -8.5"
            fill="none"
            stroke="#e1ead9"
            stroke-opacity=".7"
            stroke-width=".9"
            stroke-linecap="round"
          />
          <path
            d="M11 -4 l6 -7 M21 -6.5 l5 -6 M11 -2.5 l5 5 M21 -5 l4.5 5.2"
            fill="none"
            stroke="#e1ead9"
            stroke-opacity=".4"
            stroke-width=".6"
            stroke-linecap="round"
          />
        </g>
      </defs>
    </svg>

    <div class="row" id="row"></div>
    <div class="small" id="small"><small>A 40 px:</small></div>

    <script>
      function mulberry32(a) {
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const f = (n) => n.toFixed(1);
      const EDGE = '#8f3a55';

      function ring(r, n, off, sc, grad) {
        let o = '';
        for (let i = 0; i < n; i++) {
          const a = off + (360 / n) * i + (r() - 0.5) * 14;
          const k = sc * (1 + (r() - 0.5) * 0.12);
          o +=
            `<g transform="translate(50 48) rotate(${f(a)}) scale(${f(k)})">` +
            `<use href="#pt" fill="url(#${grad})" stroke="${EDGE}" stroke-opacity=".5" stroke-width="${f(1.3 / k)}"/>` +
            `<path d="M0 -4 C-1 -16 -1 -28 0 -38 M-7 -8 C-9 -18 -9 -26 -7 -33 M7 -8 C9 -18 9 -26 7 -33" fill="none" stroke="${EDGE}" stroke-opacity=".16" stroke-width="${f(0.7 / k)}" stroke-linecap="round"/>` +
            `<path d="M-12 -37 C-5 -42.5 5 -42.5 12 -37" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="${f(1.8 / k)}" stroke-linecap="round"/>` +
            `</g>`;
        }
        return o;
      }

      function rose(seed) {
        const r = mulberry32(seed);
        let s = '<ellipse cx="50" cy="50" rx="47" ry="45" fill="url(#wash)"/>';
        // Tallo, espinas y hojas
        s +=
          '<path d="M50 78 C47 92 53 108 50 128" fill="none" stroke="#4a6444" stroke-width="3.6" stroke-linecap="round"/>';
        s +=
          '<path d="M49.2 80 C46.2 92 52.2 108 49.2 126" fill="none" stroke="#9db592" stroke-opacity=".55" stroke-width=".9" stroke-linecap="round"/>';
        s += '<path d="M49 100 L44 97 L49 96Z M51 112 L56 109 L51 108Z" fill="#4a6444"/>';
        const lr = -8 - r() * 8;
        s += `<use href="#leaf" transform="translate(50.5 100) rotate(${f(lr)}) scale(.92)"/>`;
        s += `<use href="#leaf" transform="translate(49.5 114) scale(-.92 .92) rotate(${f(-10 - r() * 8)})"/>`;
        // Sépalos
        for (let i = 0; i < 5; i++)
          s += `<use href="#sep" transform="translate(50 74) rotate(${f(-52 + i * 26 + (r() - 0.5) * 8)})"/>`;
        // Flor: 4 anillos con sombra entre capas
        const n1 = 5 + (r() > 0.6 ? 1 : 0);
        s += ring(r, n1, 0, 0.86, 'gA');
        s += '<circle cx="50" cy="48" r="27" fill="url(#shade)"/>';
        s += ring(r, 5, 36, 0.64, 'gB');
        s += '<circle cx="50" cy="48" r="18" fill="url(#shade)"/>';
        s += ring(r, 4, 10, 0.44, 'gC');
        s += ring(r, 3, 60, 0.26, 'gD');
        // Remolino central
        s +=
          '<path d="M50 51.5 C45.5 51.5 44.5 46 49 45 C54.5 44 56.5 50.5 52 53.5 C46.5 56.5 41.5 51 43.5 45.5" fill="none" stroke="#6e2a40" stroke-opacity=".55" stroke-width="1" stroke-linecap="round"/>';
        // Motas de pigmento (granulación)
        for (let i = 0; i < 34; i++) {
          const a = r() * 6.2832,
            d = Math.sqrt(r()) * 33;
          s += `<circle cx="${f(50 + Math.cos(a) * d)}" cy="${f(48 + Math.sin(a) * d)}" r="${f(0.3 + r() * 0.5)}" fill="${EDGE}" fill-opacity="${f(0.2 + r() * 0.2)}"/>`;
        }
        return s;
      }
      const svg = (seed) =>
        `<svg viewBox="0 0 100 130" role="img" aria-label="Rosa, variante ${seed}">${rose(seed)}</svg>`;

      // Grano de papel: una sola imagen en mosaico (barata) en vez de un filtro (caro).
      function makeGrain(size) {
        const c = document.createElement('canvas');
        c.width = c.height = size;
        const x = c.getContext('2d');
        const r = mulberry32(99);
        const img = x.createImageData(size, size);
        for (let i = 0; i < size * size; i++) {
          img.data[i * 4] = 70;
          img.data[i * 4 + 1] = 55;
          img.data[i * 4 + 2] = 60;
          img.data[i * 4 + 3] = Math.pow(r(), 2.2) * 130;
        }
        x.putImageData(img, 0, 0);
        x.strokeStyle = 'rgba(90,70,70,0.12)';
        x.lineWidth = 0.6;
        for (let i = 0; i < 70; i++) {
          const px = r() * size,
            py = r() * size,
            l = 4 + r() * 11,
            an = r() * 6.283;
          x.beginPath();
          x.moveTo(px, py);
          x.lineTo(px + Math.cos(an) * l, py + Math.sin(an) * l);
          x.stroke();
        }
        return c;
      }
      const grain = makeGrain(128);
      document.documentElement.style.setProperty('--grain', `url(${grain.toDataURL('image/png')})`);

      document.getElementById('row').innerHTML = [11, 22, 33, 44, 55, 66]
        .map((s) => `<div class="cell">${svg(s)}</div>`)
        .join('');
      document
        .getElementById('small')
        .insertAdjacentHTML('beforeend', [11, 33, 55].map(svg).join(''));

      const gi = document.getElementById('gi');
      const setGi = () => document.documentElement.style.setProperty('--gi', gi.value / 100);
      gi.addEventListener('input', setGi);
      setGi();

      grain.toBlob(
        (b) => {
          document.getElementById('size').textContent = b
            ? `WebP a calidad 0,8: ${(b.size / 1024).toFixed(1)} KB`
            : 'Este navegador no codifica WebP';
        },
        'image/webp',
        0.8,
      );
      document.getElementById('dl').addEventListener('click', () => {
        grain.toBlob(
          (b) => {
            if (!b) return;
            const a = document.createElement('a');
            a.href = URL.createObjectURL(b);
            a.download = 'paper-grain.webp';
            a.click();
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
          },
          'image/webp',
          0.8,
        );
      });
    </script>
  </body>
</html>
